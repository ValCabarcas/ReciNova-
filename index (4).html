<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#146b52"><title>ReciNova | Clasifica en segundos</title>
<style>
:root{--green:#146b52;--green2:#e6f5ee;--ink:#172522;--muted:#64746c;--line:#dce6df;--cream:#f7faf7}*{box-sizing:border-box}body{margin:0;background:#f0f5f0;font:16px/1.48 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}.wrap{max-width:560px;margin:0 auto;min-height:100vh;background:white;box-shadow:0 4px 35px #203f2b14}.top{background:white;color:var(--ink);padding:18px 22px 20px;border-bottom:3px solid #d9eddd;text-align:center}.logo{display:block;width:210px;max-width:80%;height:auto;margin:0 auto}.top p{font-weight:600;color:var(--green)!important;font-size:14px}.brand{font-weight:850;letter-spacing:-.7px;font-size:28px}.brand span{color:#baf1c9}.top p{margin:5px 0 0;color:#e0f4eb}.content{padding:22px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--green);font-weight:800}h1{font-size:25px;line-height:1.2;margin:7px 0 8px}p{margin:6px 0 13px}.hint{color:var(--muted);font-size:14px}.search{display:flex;align-items:center;gap:10px;border:2px solid #d9e9de;border-radius:15px;padding:0 14px;margin:16px 0}.search input{border:0;outline:none;padding:16px 0;font:inherit;width:100%;min-width:0}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.item{cursor:pointer;min-height:147px;border:1.5px solid var(--line);border-radius:18px;background:#fff;padding:12px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;color:var(--ink);font:inherit;font-weight:700;box-shadow:0 2px 6px #102d1810}.item:focus-visible,.btn:focus-visible{outline:3px solid #e1b34e;outline-offset:2px}.item:hover{border-color:var(--green);background:var(--cream)}.emoji{font-size:48px;line-height:1.2}.item small{font-weight:400;color:var(--muted);font-size:12px}.back{background:none;border:0;color:var(--green);font:inherit;font-weight:700;padding:8px 0 18px;cursor:pointer}.result{border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-top:16px}.bin{display:flex;align-items:center;gap:15px;padding:20px}.bin-icon{width:70px;height:78px;display:grid;place-items:center;border-radius:15px;font-size:45px;border:1px solid #0002}.bin b{font-size:23px}.bin p{margin:4px 0 0;font-size:14px}.detail{padding:17px 20px;background:var(--cream);font-size:15px}.question{padding:20px;border:1px solid var(--line);border-radius:18px;margin-top:15px}.question h2{font-size:20px;margin:0 0 8px}.btn{background:var(--green);color:white;border:0;border-radius:13px;padding:14px 17px;font:inherit;font-weight:750;cursor:pointer}.btn.secondary{background:#e9f3ec;color:var(--green)}.buttons{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.note{background:#fff8de;border-left:4px solid #d6a93e;padding:12px;border-radius:8px;margin-top:17px;font-size:13px}.foot{font-size:12px;color:var(--muted);padding:24px 22px;border-top:1px solid var(--line)}.hidden{display:none!important}.all{grid-column:1/-1;color:var(--muted);padding:20px 0}.panel{margin-top:24px;border-top:1px solid var(--line);padding-top:14px}.panel summary{cursor:pointer;color:var(--green);font-weight:750}.panel table{width:100%;font-size:13px;border-collapse:collapse;margin-top:12px}.panel td,.panel th{border-bottom:1px solid var(--line);padding:7px;text-align:left}.panel .small{font-size:12px;color:var(--muted)}.tag{display:inline-block;color:var(--green);background:#e7f4e9;font-size:12px;font-weight:700;padding:5px 9px;border-radius:99px}
.match-percent{display:inline-block;background:#e7f4e9;color:#126747;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800}.match-disclaimer{grid-column:1/-1;font-size:12px;color:var(--muted);margin:0 0 12px}.cards>.all{grid-column:1/-1;padding:7px 0 0}.cards>.all p{margin:4px 0 0}

/* ReciNova · identidad visual 2026 */
:root{--green:#117b58;--green2:#e7f7ee;--ink:#173128;--muted:#667d70;--line:#dcece1;--cream:#f7fbf6}
body{background:radial-gradient(circle at 5% 5%,#dbf6df,transparent 32%),radial-gradient(circle at 100% 20%,#e9f2db,transparent 35%),#edf5ef}
.wrap{max-width:630px;box-shadow:0 25px 90px #174a2923;background:#fff}
.top{position:relative;isolation:isolate;overflow:hidden;border:0;padding:28px 22px 24px;background:linear-gradient(145deg,#edfaef,#fff 68%)}
.top:before,.top:after{content:"";position:absolute;border-radius:50%;z-index:-1}.top:before{width:200px;height:200px;top:-110px;right:-60px;background:#b9e8bd66}.top:after{width:160px;height:160px;bottom:-115px;left:-65px;background:#e8f5b677}
.logo{width:240px;filter:drop-shadow(0 6px 6px #245b2712)}.top p{font-size:13px;letter-spacing:.1px}
.content{padding:25px 24px 32px}.eyebrow{font-size:11px;letter-spacing:1.8px;color:#167c55}h1{font-size:clamp(26px,6vw,34px);letter-spacing:-1.2px;line-height:1.13;margin:9px 0 12px}.hint{font-size:14px;line-height:1.65}
.search{position:relative;border:1.5px solid #c4e3ce;box-shadow:0 7px 24px #0f684012;border-radius:18px;margin:20px 0 22px;background:#fff;transition:.2s ease}
.search:focus-within{border-color:#19a572;box-shadow:0 0 0 4px #4ad59e2b,0 10px 28px #0f684012}.search span{font-size:26px;color:#13845a}.search input{padding:18px 0;font-size:15px}
.cards{gap:13px}.item{position:relative;border:1px solid #dfece3;border-radius:21px;min-height:158px;padding:18px 12px;background:linear-gradient(160deg,#fff,#fcfefb);box-shadow:0 6px 15px #153a1e0a;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.item:hover{transform:translateY(-3px);box-shadow:0 12px 24px #153a1e17;border-color:#8ccfac;background:#f8fff9}.item:active{transform:scale(.98)}.item .emoji{font-size:43px;background:#eef9f0;border-radius:18px;width:76px;height:73px;display:grid;place-items:center;box-shadow:inset 0 -3px 9px #2c74400a}.item small{line-height:1.45;font-size:12px}
.result{border-radius:22px;box-shadow:0 12px 32px #1d57301a;border:1px solid #d5e9db}.bin{background:linear-gradient(125deg,#fff,#f5fcf6);padding:24px 20px}.bin-icon{box-shadow:0 5px 15px #183e2a18;border-radius:18px}.detail{background:#f8fbf7;line-height:1.7;padding:19px 23px}.question{background:#fbfefb;box-shadow:0 8px 22px #173c2510;border-radius:20px;padding:22px}.question h2{letter-spacing:-.4px}
.btn{background:linear-gradient(135deg,#0d7950,#19956a);box-shadow:0 5px 14px #137e4d25;transition:filter .2s,transform .2s}.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}.btn.secondary{background:#e6f5ea;box-shadow:none}
.back{background:#ecf8ef;border-radius:99px;padding:10px 16px;margin-bottom:19px}.note{background:#fff9e9;border:1px solid #f4e6b7;border-left:4px solid #dfb253;border-radius:13px;line-height:1.55}.foot{background:#f7fbf7;text-align:center;padding:20px 28px}.tag{background:#dcf3e4}
.hero-chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}.hero-chips span{border:1px solid #cfe9d7;background:#f4fcf5;color:#28764f;font-weight:750;font-size:11px;border-radius:100px;padding:7px 11px}
.section-title{font-size:12px;font-weight:850;color:#345a44;letter-spacing:1px;text-transform:uppercase;margin:4px 0 12px}
@media(max-width:390px){.content{padding:20px 16px}.item{min-height:147px;padding:12px 7px}.top{padding:20px 16px}.logo{width:210px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


/* Integración de identidad: logo sin fondo ni recuadro */
.top{background:linear-gradient(145deg,#eef9f1 0%,#ffffff 45%,#e8f6ec 100%);padding:26px 20px 24px;border-bottom:1px solid #d9ecdf;box-shadow:inset 0 -1px 0 #eef6f0}
.top .logo-card{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;background:linear-gradient(180deg,#ffffff,#f7fbf8);border:1px solid #e1ece5;border-radius:22px;box-shadow:0 14px 32px rgba(17,123,88,.08)} .top .logo{display:block;width:clamp(150px,44vw,230px);max-width:100%;height:auto;margin:0 auto;filter:none;object-fit:contain;border-radius:12px}
.top p{margin:10px auto 0;font-size:13px;color:#246847!important;font-weight:600;background:#f1fbf4;border:1px solid #dceee2;display:inline-block;padding:7px 12px;border-radius:999px}
@media(max-width:390px){.top .logo{width:245px}.top{padding-top:26px}}

/* Respuesta final concisa: el contenedor es el único resultado visible. */
.result{border:0;background:transparent;box-shadow:none;overflow:visible}
.simple-bin{min-height:190px;justify-content:center;flex-direction:column;gap:14px;text-align:center;background:linear-gradient(150deg,#f7fcf7,#edf7ef);border:1px solid #d8e9de;border-radius:24px;box-shadow:0 15px 30px #18492d14;padding:26px 15px}
.simple-bin .bin-icon{width:92px;height:100px;border-radius:23px;font-size:57px}
.simple-bin .bin-copy b{display:block;font-size:clamp(24px,5vw,32px);letter-spacing:-.7px;line-height:1.2}
.shortcut{grid-column:1/-1;max-width:320px;justify-self:center;width:100%}

/* Orientación excepcional: acción concreta sin inventar un contenedor. */
.special-options{flex-direction:column;align-items:stretch}.special-options .btn{text-align:left}
.special-warn{font-size:13px;font-weight:800;color:#714b0b;margin:5px 0 7px!important}
.special-next{font-size:14px!important;line-height:1.55!important;margin:0!important;max-width:38rem}
.simple-bin:has(.special-next){align-items:flex-start}.simple-bin:has(.special-next) .bin-copy{flex:1;min-width:0}
@media(max-width:420px){.simple-bin:has(.special-next){gap:10px;padding:16px}.simple-bin:has(.special-next) .bin-icon{width:50px;height:58px;flex-shrink:0;font-size:30px}}

/* Imágenes aprobadas: el residuo completo siempre queda visible, también en celulares. */
.item .waste-photo{display:block;width:100%;max-width:180px;height:152px;object-fit:contain;object-position:center;border-radius:12px;background:#fff;margin:0 auto 4px;flex-shrink:0}
.item:has(.waste-photo){min-height:238px;justify-content:flex-start;padding:12px 9px;gap:8px}
.item:has(.waste-photo) strong,.item:has(.waste-photo) small{max-width:100%}
@media(max-width:390px){.item .waste-photo{height:132px;max-width:152px}.item:has(.waste-photo){min-height:220px;padding:10px 6px}}


</style>
</head>

const $=id=>document.getElementById(id);let current=null;let counts={};try{counts=JSON.parse(localStorage.getItem('recinova_counts')||'{}')}catch(e){};
const norm=t=>(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const stopWords=['de','la','el','los','las','y','o','con','sin','para','del','un','una','unos','unas','que','en'];
function addCount(id){recordCentralQuery(id);counts[id]=(counts[id]||0)+1;try{localStorage.setItem('recinova_counts',JSON.stringify(counts))}catch(e){};}
function tokensOf(t){return norm(t).split(/[^a-z0-9ñ]+/).filter(t=>t&&!stopWords.includes(t))}
function isSimilar(a,b){return a===b || (a.length>=4 && b.length>=4 && (a.startsWith(b)||b.startsWith(a))) || (a.length>=5 && b.length>=5 && a.slice(0,-1)===b.slice(0,-1))}
function relatedItems(term){
  const t=norm(term);
  // Dar prioridad al objeto nombrado, no a la comida que contenía.
  const priority=[
    [/\b(?:vidrio|cristal|frasco)\b/, 'vidrio'],
    [/\b(?:icopor|poliestireno)\b/, 'icopor'],
    [/\b(?:vaso|vasitos|vasito)\b/, 'vaso'],
    [/\b(?:cajita|tetrapak|tetrapack)\b/, 'caja'],
    [/\b(?:lata|aluminio)\b/, 'metal'],
    [/\b(?:envoltura|empaque|papitas|mecato)\b/, 'empaque'],
    [/\b(?:servilleta|servilletas)\b/, 'servilleta'],
    [/\b(?:cascara|cascaras|sobras)\b/, 'banano'],
    [/\b(?:papel|carton)\b/, 'papel'],
    [/\b(?:botella|botellas|pet)\b/, 'botella'],
    [/\b(?:pilas?|baterias?|quimicos?|agujas?|jeringas?)\b/, 'especial']
  ];
  const match=priority.find(([regex])=>regex.test(t));
  if(match){const selected=ITEMS.find(x=>x.id===match[1]);if(selected)return [selected]}

  const query=tokensOf(term);
  if(!query.length) return [];
  return ITEMS.map(item=>{
    const title=tokensOf(item.name), words=tokensOf(item.name+' '+item.sub+' '+(item.keywords||''));
    const found=query.filter(q=>words.some(w=>isSimilar(q,w)));
    const titleMatches=query.filter(q=>title.some(w=>isSimilar(q,w))).length;
    const fraction=found.length/query.length;
    // Porcentaje de similitud textual, NO probabilidad de reciclaje correcto.
    let pct=Math.round(fraction*70+Math.min(titleMatches,2)*12);
    if(norm(term)===norm(item.name)) pct=100;
    else pct=Math.min(98,pct);
    return {...item,percent:pct,matched:found.length,titleMatches};

    $('cards').querySelector('button').addEventListener('click',()=>{
      current={id:'empaque',name:'Envoltura de papitas',emoji:'🍟',kind:'black'};
      addCount('empaque');
      $('home').classList.add('hidden');$('detailview').classList.remove('hidden');
      $('itemtitle').textContent='🍟 Envoltura de papitas';
      $('question').classList.add('hidden');showResult(current);window.scrollTo(0,0);
    });
    return;
  }
  if(!term){$('cards').innerHTML=ITEMS.map(x=>itemCard(x,false)).join('');}
  else {
    const winner=relatedItems(term);
    if(winner.length){
      $('cards').innerHTML='<div class="all"><b>Podría estar relacionado con:</b><p class="hint">Esta es la opción más relacionada con tu búsqueda.</p></div>'+itemCard(winner[0],false)+'';
    }else{
      $('cards').innerHTML='<p class="all">No encontramos una coincidencia suficiente. Prueba escribiendo el tipo de objeto (por ejemplo, “vaso”, “botella” o “empaque”). Para residuos peligrosos, consulta al área ambiental.</p>';
    }
  }
  document.querySelectorAll('.item').forEach(btn=>btn.addEventListener('click',()=>openItem(btn.dataset.id)))

function openItem(id){openItemWithoutCounting(id,true)}
function openItemWithoutCounting(id,shouldCount=false){
  current=ITEMS.find(x=>x.id===id);
  if(!current)return;
  if(shouldCount)addCount(id);
  $('home').classList.add('hidden');$('detailview').classList.remove('hidden');
  $('itemtitle').textContent=current.emoji+' '+current.name;
  $('result').classList.add('hidden');$('question').classList.add('hidden');
  document.querySelectorAll('#detailview > .btn.secondary').forEach(x=>x.remove());
  showResult(current);
  window.scrollTo(0,0);
}
const BINS={white:{title:'Blanco',bg:'#f3f4f4',fg:'#202525'},black:{title:'Negro',bg:'#242929',fg:'white'},green:{title:'Verde',bg:'#287e49',fg:'white'},special:{title:'Especial',bg:'#f3d9a5',fg:'#573b12'}};
function showResult(data){
  document.querySelectorAll('#detailview > .btn.secondary').forEach(x=>x.remove());
  if(data.kind==='question'){
    $('result').classList.add('hidden');
    $('question').innerHTML=`<h2>${data.q}</h2><div class="buttons"><button class="btn" data-answer="yes">Sí</button><button class="btn secondary" data-answer="no">No</button></div>`;
    $('question').classList.remove('hidden');
    $('question').querySelectorAll('[data-answer]').forEach(btn=>btn.onclick=()=>showResult(data[btn.dataset.answer]));
    return;
  }
  if(data.kind==='options'||data.kind==='special-choice'){
    $('result').classList.add('hidden');
    $('question').innerHTML='<h2>'+(data.q||'¿Qué tipo de residuo tienes?')+'</h2><div class="buttons special-options">'+data.choices.map((c,i)=>'<button class="btn secondary" data-choice="'+i+'">'+c.label+'</button>').join('')+'</div>';
    $('question').classList.remove('hidden');
    $('question').querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{
      const choice=data.choices[Number(b.dataset.choice)];
      showResult(choice.next||{kind:'special',title:choice.title,detail:choice.detail});
    });
    return;
  }
  const b=BINS[data.kind];
  if(!b)return;
  const text=data.kind==='special'?(data.title||'Recolección especial'):'Contenedor '+b.title;
  const extra=data.kind==='special'?'<p class="special-warn">NO va al blanco, negro ni verde.</p><p class="special-next">'+(data.detail||'Consulta a Servicios Generales.')+'</p>':'';
  $('result').innerHTML=`<div class="bin simple-bin"><div class="bin-icon" style="background:${b.bg};color:${b.fg}">${data.kind==='special'?'!':'♻'}</div><div class="bin-copy"><b>${text}</b>${extra}</div></div>`;
  $('question').classList.add('hidden');$('result').classList.remove('hidden');
  document.querySelectorAll('#detailview > .btn.secondary').forEach(x=>x.remove());
  if(current.kind==='question'||current.kind==='options'||current.kind==='special-choice'){
    const more=document.createElement('button');
    more.className='btn secondary';
    more.textContent='Cambiar respuesta';more.style.marginTop='12px';
    more.onclick=()=>showResult(current);
    $('result').after(more);
  }
}
$('back').onclick=()=>{$('detailview').classList.add('hidden');$('home').classList.remove('hidden');document.querySelectorAll('#detailview > .btn.secondary').forEach(x=>x.remove());$('q').value='';renderCards();window.scrollTo(0,0)};
$('q').addEventListener('input',renderCards);renderCards();
</script></body></html>
